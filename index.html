<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>子育て世代向け地域コミュニティ参加支援アプリ</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>

  <body>
    <!-- ヘッダー -->
    <header>
      <h1>子育て世代向け地域コミュニティ参加支援アプリ</h1>
    </header>

    <!-- 検索 -->
    <section>
      <h2>イベントを探す</h2>

      <input type="text" placeholder="イベント名や地域を入力" />

      <button>検索</button>
    </section>

    <!-- おすすめイベント -->
    <section>
      <h2>おすすめイベント</h2>

      <div class="event-card">
        <h3>親子リトミック教室</h3>

        <p>日時：2026年7月20日</p>

        <p>場所：○○公民館</p>

        <button>詳細を見る</button>
      </div>

      <div class="event-card">
        <h3>夏祭りイベント</h3>

        <p>日時：2026年7月28日</p>

        <p>場所：○○公園</p>

        <button>詳細を見る</button>
      </div>
    </section>

    <!-- 新着イベント -->
    <section>
      <h2>新着イベント</h2>

      <ul>
        <li>絵本の読み聞かせ会</li>

        <li>親子クッキング教室</li>

        <li>水遊びイベント</li>
      </ul>
    </section>

    <!-- コミュニティ一覧 -->
    <section>
      <h2>地域コミュニティ</h2>

      <div class="community-card">
        <h3>〇〇子育てサークル</h3>

        <p>対象：0〜3歳</p>

        <button>詳細を見る</button>
      </div>

      <div class="community-card">
        <h3>親子スポーツクラブ</h3>

        <p>対象：4〜6歳</p>

        <button>詳細を見る</button>
      </div>
    </section>

    <!-- ナビゲーション -->
    <nav>
      <a href="index.html">ホーム</a>

      <a href="pages/event-list.html">イベント</a>

      <a href="pages/community-detail.html">コミュニティ</a>

      <a href="pages/mypage.html">マイページ</a>
    </nav>
  </body>
</html>
