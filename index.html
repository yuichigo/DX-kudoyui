<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>子育て世代向け地域コミュニティ参加支援アプリ</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>

  <body>
    <!-- ヘッダー -->
    <header>
      <h1>子育て世代向け地域コミュニティ参加支援アプリ</h1>
    </header>

    <!-- 検索 -->
    <section>
      <h2>イベントを探す</h2>

      <input
        type="text"
        id="home-search"
        placeholder="イベント名や地域を入力"
      />

      <button onclick="goSearch()">検索</button>
    </section>

    <!-- おすすめイベント -->
    <section>
      <h2>おすすめイベント</h2>

      <div id="recommend-events"></div>
    </section>

    <!-- 新着イベント -->
    <section>
      <h2>新着イベント</h2>
      <ul id="new-events"></ul>
    </section>

    <!-- コミュニティ一覧 -->
    <section>
      <h2>地域コミュニティ</h2>

      <div id="community-list"></div>
    </section>

    <!-- ナビゲーション -->
    <nav>
      <a href="index.html">ホーム</a>

      <a href="pages/event-list.html">イベント</a>

      <a href="pages/community-detail.html">コミュニティ</a>

      <a href="pages/mypage.html">マイページ</a>
    </nav>
    <script src="js/main.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
