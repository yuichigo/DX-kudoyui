<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>イベント一覧</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/event.css" />
  </head>

  <body>
    <header>
      <h1>イベント一覧</h1>
    </header>

    <section>
      <h2>イベント検索</h2>

      <input type="text" placeholder="イベント名" />

      <select>
        <option>子どもの年齢</option>
        <option>0〜2歳</option>
        <option>3〜5歳</option>
        <option>小学生</option>
      </select>

      <button>検索</button>
    </section>

    <section>
      <h2>開催予定イベント</h2>

      <div class="event-card">
        <h3>親子リトミック教室</h3>

        <p>日時：2026年7月20日</p>

        <p>場所：〇〇公民館</p>

        <p>対象：0〜3歳</p>

        <button onclick="location.href = 'event-detail.html'">
          詳細を見る
        </button>
      </div>

      <div class="event-card">
        <h3>夏祭りイベント</h3>

        <p>日時：2026年7月28日</p>

        <p>場所：〇〇公園</p>

        <p>対象：全年齢</p>

        <button onclick="location.href = 'event-detail.html'">
          詳細を見る
        </button>
      </div>

      <div class="event-card">
        <h3>親子クッキング教室</h3>

        <p>日時：2026年8月3日</p>

        <p>場所：〇〇センター</p>

        <p>対象：4〜6歳</p>

        <button onclick="location.href = 'event-detail.html'">
          詳細を見る
        </button>
      </div>
    </section>

    <nav>
      <a href="../index.html">ホーム</a>

      <a href="event-list.html">イベント</a>

      <a href="community-detail.html">コミュニティ</a>

      <a href="mypage.html">マイページ</a>
    </nav>
  </body>
</html>
