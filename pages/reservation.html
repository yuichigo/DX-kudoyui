<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>イベント予約</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/reservation.css" />
  </head>

  <body>
    <header>
      <h1>イベント予約</h1>
    </header>

    <main>
      <!-- イベント情報 -->

      <section id="reservation-detail"></section>

      <!-- 参加人数 -->

      <section>
        <h2>参加人数</h2>

        <label for="people">人数</label>

        <select id="people">
          <option>1人</option>

          <option>2人</option>

          <option>3人</option>

          <option>4人</option>
        </select>
      </section>

      <!-- 注意事項 -->

      <section>
        <h2>注意事項</h2>

        <ul>
          <li>当日は開始10分前までに受付をお願いします。</li>

          <li>キャンセルする場合は前日までにご連絡ください。</li>

          <li>動きやすい服装でお越しください。</li>
        </ul>
      </section>

      <!-- 予約ボタン -->

      <section>
        <button>予約を確定する</button>
      </section>
    </main>

    <nav>
      <a href="../index.html">ホーム</a>

      <a href="event-list.html">イベント</a>

      <a href="community-detail.html">コミュニティ</a>

      <a href="mypage.html">マイページ</a>
    </nav>
    <script src="../js/main.js"></script>
  </body>
</html>
